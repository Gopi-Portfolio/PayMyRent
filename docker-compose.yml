# Local development: PostgreSQL 16 + API (sandbox payments, console messaging, mock AI, dev OTP).
name: paymyrent
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paymyrent
      POSTGRES_PASSWORD: paymyrent
      POSTGRES_DB: paymyrent
      TZ: UTC
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymyrent"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    env_file: ./api/.env.example
    environment:
      FORWARDED_ALLOW_IPS: "*"      # local Docker network only; production uses docker-compose.prod.yml
      RG_DATABASE_URL: postgresql+psycopg://paymyrent:paymyrent@db:5432/paymyrent            # system: migrations, jobs, webhooks, admin
      RG_APP_DATABASE_URL: postgresql+psycopg://pmr_app:pmr_app@db:5432/paymyrent # signed-in requests: limited role + row-level security
      RG_APP_DB_PASSWORD: pmr_app
      RG_DEMO_AUTO_VERIFY_PROPERTIES: "on"     # local demo only: a developer can add a property without a reviewer. Refused in production.
      RG_DOC_AUTO_APPROVE: "true"              # the automatic owner document check (docs/DECISIONS.md D-21a): Add property shows the same screens for every developer
      RG_PUBLIC_BASE_URL: http://${LAN_IP:-localhost}:${API_PORT:-8000}
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db:
        condition: service_healthy

  # Local stand-in for the production scheduler (EventBridge): bills the months, queues the rent reminders and sends the queued messages.
  # Each job is safe to repeat (one run per day / per 15 minutes), so this simply checks every 15 minutes.
  scheduler:
    build: ./api
    env_file: ./api/.env.example
    environment:
      RG_DATABASE_URL: postgresql+psycopg://paymyrent:paymyrent@db:5432/paymyrent
      RG_APP_DATABASE_URL: postgresql+psycopg://pmr_app:pmr_app@db:5432/paymyrent
      RG_PUBLIC_BASE_URL: http://${LAN_IP:-localhost}:8000
      RG_DOC_AUTO_APPROVE: "true"
    command: ["sh", "-c", "while true; do for j in generate_invoices send_reminders dispatch_notifications; do python -m app.cli $$j || true; done; sleep 900; done"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
