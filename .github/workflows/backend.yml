name: backend

on:
  pull_request:
    paths: ["api/**", "deploy/**", "docker-compose.prod.yml", "scripts/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Image build and deploy are done by Jenkins (Jenkinsfile, docs/JENKINS.md), so GitHub only runs the tests on pull requests.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Starts a throwaway Postgres 16, runs the whole suite (unit, SQL invariants, API end-to-end), then removes it.
      - run: bash scripts/build-backend.sh --test-only
