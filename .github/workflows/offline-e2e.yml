name: offline-e2e

# The offline capture check against a REAL backend: the app's queue engine, talking over HTTP to the API in a container with its own empty Postgres.
# It loses replies, drops the connection half way, sends duplicate copies at once and signs out in the middle, and checks every entry arrives exactly once.
on:
  pull_request:
    paths: ["mobile/**", "api/**", ".github/workflows/offline-e2e.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "api/**", ".github/workflows/offline-e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Start an empty database
        run: |
          docker network create e2e
          docker run -d --name db --network e2e -e POSTGRES_USER=pmr -e POSTGRES_PASSWORD=pmr -e POSTGRES_DB=e2e postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U pmr && break; sleep 1; done

      - name: Build and start the API
        run: |
          docker build -q -t paymyrent-api:e2e api
          docker run -d --name api --network e2e -p 18480:8000 --env-file api/.env.example \
            -e FORWARDED_ALLOW_IPS='*' \
            -e RG_DATABASE_URL=postgresql+psycopg://pmr:pmr@db:5432/e2e \
            -e RG_APP_DATABASE_URL=postgresql+psycopg://pmr_app:pmr_app@db:5432/e2e \
            -e RG_APP_DB_PASSWORD=pmr_app -e RG_DEMO_AUTO_VERIFY_PROPERTIES=on -e RG_PUBLIC_BASE_URL=http://localhost:18480 \
            paymyrent-api:e2e
          for i in $(seq 1 60); do curl -sf http://localhost:18480/api/v1/plans >/dev/null && exit 0; sleep 2; done
          docker logs api
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install the app's dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Offline capture, live
        working-directory: mobile
        env:
          OFFLINE_E2E_URL: http://localhost:18480
        run: npm run test:offline-live

      - name: API log (only if something failed)
        if: failure()
        run: docker logs api 2>&1 | tail -120
